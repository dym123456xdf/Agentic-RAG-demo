<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>个人知识库问答</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<aside id="sidebar">
  <div>
    <h1>📚 个人知识库</h1>
    <h2 id="status">未连接</h2>
  </div>

  <div>
    <h2>💬 会话 <button class="btn ghost" id="btnNew" style="width:100%;margin-top:8px">＋ 新会话</button></h2>
    <ul class="session-list" id="sessionList"></ul>
  </div>

  <a class="btn ghost" href="/static/manage.html" style="text-align:center;text-decoration:none">⚙️ 知识库管理</a>

  <button class="btn ghost" id="btnClear" style="margin-top:auto">清空当前会话</button>
</aside>

<section id="main">
  <div id="chat"></div>
  <div id="input-bar">
    <input id="q" placeholder="向你的知识库提问..." autocomplete="off">
    <button id="send">发送</button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="/static/app.js"></script>
<script>
const $ = id => document.getElementById(id);
const chatEl = $("chat");

let currentSessionId = null;   // 当前会话(持久化在服务端,前端不再维护 history)

// ---------- 会话列表 ----------
async function refreshSessions(selectId = null) {
  try {
    const sessions = await SessionsAPI.list();
    const ul = $("sessionList");
    if (!sessions.length) {
      ul.innerHTML = '<li class="empty">暂无会话</li>';
      currentSessionId = null;
      return;
    }
    ul.innerHTML = "";
    for (const s of sessions) {
      const li = document.createElement("li");
      li.dataset.id = s.id;
      if (s.id === (selectId || currentSessionId)) li.classList.add("active");
      li.innerHTML =
        `<span class="title" title="${escapeHtml(s.title)}">${escapeHtml(s.title)}</span>` +
        `<span class="del" title="删除会话">✕</span>`;
      li.onclick = e => {
        if (e.target.classList.contains("del")) { removeSession(s.id); return; }
        switchSession(s.id);
      };
      ul.appendChild(li);
    }
  } catch (e) { showToast(e.message, true); }
}

async function createSession() {
  try {
    const s = await SessionsAPI.create();
    currentSessionId = s.id;
    chatEl.innerHTML = "";
    await refreshSessions(s.id);
    showToast("已新建会话");
  } catch (e) { showToast(e.message, true); }
}

async function removeSession(id) {
  if (!confirm("删除该会话及其全部对话记录?")) return;
  try {
    await SessionsAPI.remove(id);
    if (id === currentSessionId) {
      currentSessionId = null;
      chatEl.innerHTML = "";
    }
    await refreshSessions();
    showToast("会话已删除");
  } catch (e) { showToast(e.message, true); }
}

// ---------- 会话切换:拉历史渲染回显(与实时回答同一渲染路径) ----------
async function switchSession(id) {
  currentSessionId = id;
  chatEl.innerHTML = "";
  try {
    const msgs = await SessionsAPI.messages(id);
    for (const m of msgs) chatEl.insertAdjacentHTML("beforeend", messageHtml(m));
    chatEl.scrollTop = chatEl.scrollHeight;
  } catch (e) { showToast(e.message, true); }
  await refreshSessions(id);
}

$("btnNew").onclick = createSession;
$("btnClear").onclick = async () => {
  if (!currentSessionId) return showToast("当前没有会话", true);
  if (!confirm("清空当前会话的全部对话?")) return;
  try {
    await SessionsAPI.clear(currentSessionId);
    chatEl.innerHTML = "";
    showToast("会话已清空");
  } catch (e) { showToast(e.message, true); }
};

// ---------- 聊天 ----------
async function send() {
  const q = $("q").value.trim();
  if (!q) return;
  if (!currentSessionId) {
    const s = await SessionsAPI.create();
    currentSessionId = s.id;
    await refreshSessions(s.id);
  }
  $("send").disabled = true;
  chatEl.insertAdjacentHTML("beforeend", `<div class="msg user">${escapeHtml(q)}</div>`);
  $("q").value = "";
  chatEl.scrollTop = chatEl.scrollHeight;
  try {
    const r = await fetch("/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, session_id: currentSessionId }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "请求失败");
    chatEl.insertAdjacentHTML("beforeend", messageHtml(
      { role: "assistant", content: data.answer, sources: data.sources, meta: data.meta }));
    chatEl.scrollTop = chatEl.scrollHeight;
  } catch (e) {
    chatEl.insertAdjacentHTML("beforeend", `<div class="msg bot">⚠️ ${escapeHtml(e.message)}</div>`);
  } finally {
    $("send").disabled = false;
    $("q").focus();
  }
}
$("send").onclick = send;
$("q").onkeydown = e => { if (e.key === "Enter") send(); };

// ---------- 启动 ----------
fetch("/docs").then(r => $("status").textContent = r.ok ? "✅ 服务正常" : "❌ 服务异常");
(async () => {
  await refreshSessions();
  // 无会话时自动建一个,保证打开即可提问;有会话则自动选最近活跃的并回显
  if (!currentSessionId) {
    const sessions = await SessionsAPI.list().catch(() => []);
    if (sessions.length) await switchSession(sessions[0].id);
    else await createSession();
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>个人知识库问答</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f5f6f8; color: #2c3e50; height: 100vh; display: flex; }
  #sidebar { width: 280px; background: #2c3e50; color: #fff; padding: 20px;
             display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
  #sidebar h1 { font-size: 18px; }
  #sidebar h2 { font-size: 14px; opacity: .8; margin-top: 6px; }
  .drop { border: 2px dashed #576574; border-radius: 8px; padding: 18px;
          text-align: center; cursor: pointer; transition: .2s; font-size: 13px; }
  .drop:hover, .drop.drag { background: #34495e; border-color: #fff; }
  .btn { background: #3498db; color: #fff; border: 0; padding: 8px 12px;
         border-radius: 6px; cursor: pointer; font-size: 13px; }
  .btn:hover { background: #2980b9; }
  .btn.ghost { background: transparent; border: 1px solid #576574; }
  input[type=text] { background: #34495e; color: #fff; border: 1px solid #576574;
                     padding: 8px; border-radius: 6px; font-size: 13px; }
  .file-list { list-style: none; font-size: 12px; max-height: 220px; overflow-y: auto; }
  .file-list li { display: flex; justify-content: space-between; padding: 5px 8px;
                  background: #34495e; border-radius: 4px; margin-bottom: 4px;
                  word-break: break-all; }
  .file-list .name { flex: 1; overflow: hidden; text-overflow: ellipsis;
                     white-space: nowrap; }
  .file-list .chunks { color: #95a5a6; font-size: 11px; margin-left: 6px; flex-shrink: 0; }
  #main { flex: 1; display: flex; flex-direction: column; }
  #chat { flex: 1; padding: 20px; overflow-y: auto; }
  .msg { max-width: 80%; padding: 12px 14px; border-radius: 10px; margin-bottom: 14px;
         line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .user { background: #3498db; color: #fff; margin-left: auto; }
  .bot  { background: #fff; border: 1px solid #e1e4e8; }
  .sources { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ccd; font-size: 12px; }
  .src { background: #f8f9fa; border-left: 3px solid #3498db; padding: 6px 10px;
         margin: 6px 0; border-radius: 4px; }
  .meta { color: #888; font-size: 11px; margin-top: 6px; }
  #input-bar { padding: 14px 20px; background: #fff; border-top: 1px solid #e1e4e8;
               display: flex; gap: 10px; }
  #q { flex: 1; padding: 10px; border: 1px solid #ccd; border-radius: 8px;
       font-size: 14px; outline: none; }
  #send { background: #2ecc71; color: #fff; border: 0; padding: 10px 22px;
          border-radius: 8px; cursor: pointer; font-size: 14px; }
  #send:disabled { background: #95a5a6; cursor: not-allowed; }
  .toast { position: fixed; right: 20px; top: 20px; padding: 10px 14px;
           background: #2c3e50; color: #fff; border-radius: 6px; font-size: 13px;
           opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 99; }
  .toast.show { opacity: 1; }
  .toast.err { background: #c0392b; }
</style>
</head>
<body>
<aside id="sidebar">
  <div>
    <h1>📚 个人知识库</h1>
    <h2 id="status">未连接</h2>
  </div>

  <div>
    <div class="drop" id="drop">点击或拖拽文件到这里<br>支持 PDF / Word / PPT / MD / TXT</div>
    <input type="file" id="file" multiple hidden
           accept=".pdf,.docx,.pptx,.md,.markdown,.txt">
  </div>

  <div>
    <h2>📂 索引服务器目录</h2>
    <input type="text" id="dirpath" placeholder="例如 data/ 或 /abs/path" value="data/">
    <button class="btn ghost" id="btnDir" style="margin-top:8px;width:100%">扫描并入库</button>
  </div>

  <div>
    <h2>📑 已入库文件 <span id="fileCount" style="opacity:.6">(0)</span></h2>
    <ul class="file-list" id="fileList"><li style="opacity:.6;background:transparent">暂无</li></ul>
    <button class="btn ghost" id="btnRefresh" style="margin-top:6px;width:100%">刷新列表</button>
  </div>

  <div>
    <h2>统计</h2>
    <div id="stats" style="font-size:12px;opacity:.8">尚未入库</div>
  </div>

  <button class="btn ghost" id="btnClear" style="margin-top:auto">清空对话</button>
</aside>

<section id="main">
  <div id="chat"></div>
  <div id="input-bar">
    <input id="q" placeholder="向你的知识库提问..." autocomplete="off">
    <button id="send">发送</button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const chatEl = $("chat");
const toast = (msg, isErr) => {
  const t = $("toast"); t.textContent = msg; t.className = "toast show" + (isErr ? " err" : "");
  setTimeout(() => t.className = "toast", 2200);
};

const history = [];

// ---------- 上传 ----------
const drop = $("drop");
const fileInput = $("file");
drop.onclick = () => fileInput.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add("drag"); };
drop.ondragleave = () => drop.classList.remove("drag");
drop.ondrop = e => {
  e.preventDefault(); drop.classList.remove("drag");
  const files = e.dataTransfer ? e.dataTransfer.files : e.target.files;
  if (files && files.length) uploadFiles(files);
};
fileInput.onchange = e => { if (e.target.files.length) uploadFiles(e.target.files); };

async function uploadFiles(files) {
  const fd = new FormData();
  for (const f of files) fd.append("files", f);
  toast("上传并入库中...");
  try {
    const r = await fetch("/upload/files", { method: "POST", body: fd });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "上传失败");
    const skip = (data.skipped_files || []).length;
    const msg = skip > 0
      ? `新入库 ${data.chunks_ingested} 个片段,跳过 ${skip} 个重复文件`
      : `入库 ${data.chunks_ingested} 个片段,共 ${data.total_entities} 条`;
    toast(msg);
    $("stats").textContent = `共 ${data.total_entities} 条向量`;
    refreshFiles();
  } catch (e) { toast(e.message, true); }
}

$("btnDir").onclick = async () => {
  const path = $("dirpath").value.trim();
  if (!path) return toast("请填路径", true);
  toast("扫描目录并入库...");
  try {
    const r = await fetch("/upload/dir", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "失败");
    const skip = (data.skipped_files || []).length;
    const msg = skip > 0
      ? `新入库 ${data.chunks_ingested} 个片段,跳过 ${skip} 个已存在文件`
      : `从 ${data.ingested_from} 入库 ${data.chunks_ingested} 个片段`;
    toast(msg);
    $("stats").textContent = `共 ${data.total_entities} 条向量`;
    refreshFiles();
  } catch (e) { toast(e.message, true); }
};

// ---------- 已入库文件列表 ----------
async function refreshFiles() {
  try {
    const r = await fetch("/upload/files");
    const data = await r.json();
    const ul = $("fileList");
    $("fileCount").textContent = `(${data.file_count})`;
    $("stats").textContent = `共 ${data.total_chunks} 条向量 / ${data.file_count} 文件`;
    if (!data.files.length) {
      ul.innerHTML = '<li style="opacity:.6;background:transparent">暂无</li>';
      return;
    }
    ul.innerHTML = data.files.map(f =>
      `<li><span class="name" title="${escapeHtml(f.name)}">📄 ${escapeHtml(f.name)}</span>` +
      `<span class="chunks">${f.chunks}</span></li>`
    ).join("");
  } catch (e) { /* ignore */ }
}
$("btnRefresh").onclick = refreshFiles;

// ---------- 聊天 ----------
function append(role, text, extra = {}) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  if (extra.sources && extra.sources.length) {
    const wrap = document.createElement("div"); wrap.className = "sources";
    wrap.innerHTML = "<b>📎 参考来源</b>";
    extra.sources.forEach(s => {
      const item = document.createElement("div"); item.className = "src";
      item.innerHTML =
        `[#${s.index}] <b>${escapeHtml(s.source)}</b> ` +
        `<span style="float:right;color:#888">score=${s.score}</span><br>` +
        `<span style="color:#555">${escapeHtml(s.content.slice(0, 200))}…</span>`;
      wrap.appendChild(item);
    });
    div.appendChild(wrap);
  }
  if (extra.meta) {
    const m = document.createElement("div"); m.className = "meta";
    m.textContent = `意图=${extra.meta.intent} | 召回=${extra.meta.raw_count} → 重排后=${extra.meta.after_count} | 改写: ${extra.meta.rewritten}`;
    div.appendChild(m);
  }
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function escapeHtml(s) { return s.replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c])); }

async function send() {
  const q = $("q").value.trim();
  if (!q) return;
  $("send").disabled = true;
  append("user", q);
  history.push({ role: "user", content: q });
  $("q").value = "";
  try {
    const r = await fetch("/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: q,
        history: history.slice(-6).map(m => ({ role: m.role, content: m.content })),
      }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "请求失败");
    append("bot", data.answer, { sources: data.sources, meta: data.meta });
    history.push({ role: "assistant", content: data.answer });
  } catch (e) {
    append("bot", "⚠️ " + e.message);
  } finally {
    $("send").disabled = false;
    $("q").focus();
  }
}
$("send").onclick = send;
$("q").onkeydown = e => { if (e.key === "Enter") send(); };
$("btnClear").onclick = () => { chatEl.innerHTML = ""; history.length = 0; };

// 启动时 ping 一下,确认服务在
fetch("/docs").then(r => $("status").textContent = r.ok ? "✅ 服务正常" : "❌ 服务异常");
// 启动时拉一下已入库文件列表
refreshFiles();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>个人知识库问答</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<aside id="sidebar">
  <div class="brand">
    <h1><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>个人知识库</h1>
    <div id="status">未连接</div>
  </div>

  <div class="side-section">
    <div class="side-title">会话</div>
    <button class="btn ghost btn-block" id="btnNew"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>新会话</button>
    <ul class="session-list" id="sessionList"></ul>
  </div>

  <a class="btn ghost btn-block" href="/static/manage.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>知识库管理</a>

  <button class="btn ghost btn-block" id="btnClear">清空当前会话</button>
</aside>

<section id="main">
  <div id="chat"></div>
  <div id="empty-hero">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3z"/></svg>
    <h2>今天想查点什么?</h2>
    <p>基于你入库的文档检索并回答</p>
  </div>
  <div id="input-bar">
    <div class="input-wrap">
      <input id="q" placeholder="向你的知识库提问…" autocomplete="off">
      <button id="send" title="发送" aria-label="发送"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="/static/app.js"></script>
<script>
const $ = id => document.getElementById(id);
const chatEl = $("chat");

let currentSessionId = null;   // 当前会话(持久化在服务端,前端不再维护 history)

// 空状态问候:无消息时顶替聊天区展示(问候节点是 #chat 的兄弟,避免被 innerHTML 清空)
function syncHero() {
  $("main").classList.toggle("empty", chatEl.children.length === 0);
}

// ---------- 会话列表 ----------
async function refreshSessions(selectId = null) {
  try {
    const sessions = await SessionsAPI.list();
    const ul = $("sessionList");
    if (!sessions.length) {
      ul.innerHTML = '<li class="empty">暂无会话</li>';
      currentSessionId = null;
      return;
    }
    ul.innerHTML = "";
    for (const s of sessions) {
      const li = document.createElement("li");
      li.dataset.id = s.id;
      if (s.id === (selectId || currentSessionId)) li.classList.add("active");
      li.innerHTML =
        `<span class="title" title="${escapeHtml(s.title)}">${escapeHtml(s.title)}</span>` +
        `<span class="del" title="删除会话">✕</span>`;
      li.onclick = e => {
        if (e.target.classList.contains("del")) { removeSession(s.id); return; }
        switchSession(s.id);
      };
      ul.appendChild(li);
    }
  } catch (e) { showToast(e.message, true); }
}

async function createSession() {
  try {
    const s = await SessionsAPI.create();
    currentSessionId = s.id;
    chatEl.innerHTML = "";
    await refreshSessions(s.id);
    showToast("已新建会话");
  } catch (e) { showToast(e.message, true); }
  syncHero();
}

async function removeSession(id) {
  if (!confirm("删除该会话及其全部对话记录?")) return;
  try {
    await SessionsAPI.remove(id);
    if (id === currentSessionId) {
      currentSessionId = null;
      chatEl.innerHTML = "";
    }
    await refreshSessions();
    showToast("会话已删除");
  } catch (e) { showToast(e.message, true); }
  syncHero();
}

// ---------- 会话切换:拉历史渲染回显(与实时回答同一渲染路径) ----------
async function switchSession(id) {
  currentSessionId = id;
  chatEl.innerHTML = "";
  try {
    const msgs = await SessionsAPI.messages(id);
    for (const m of msgs) chatEl.insertAdjacentHTML("beforeend", messageHtml(m));
    chatEl.scrollTop = chatEl.scrollHeight;
  } catch (e) { showToast(e.message, true); }
  await refreshSessions(id);
  syncHero();
}

$("btnNew").onclick = createSession;
$("btnClear").onclick = async () => {
  if (!currentSessionId) return showToast("当前没有会话", true);
  if (!confirm("清空当前会话的全部对话?")) return;
  try {
    await SessionsAPI.clear(currentSessionId);
    chatEl.innerHTML = "";
    showToast("会话已清空");
  } catch (e) { showToast(e.message, true); }
  syncHero();
};

// ---------- 聊天 ----------
async function send() {
  const q = $("q").value.trim();
  if (!q) return;
  if (!currentSessionId) {
    const s = await SessionsAPI.create();
    currentSessionId = s.id;
    await refreshSessions(s.id);
  }
  $("send").disabled = true;
  chatEl.insertAdjacentHTML("beforeend", `<div class="msg user">${escapeHtml(q)}</div>`);
  $("main").classList.remove("empty");
  $("q").value = "";
  chatEl.scrollTop = chatEl.scrollHeight;
  try {
    const r = await fetch("/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, session_id: currentSessionId }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "请求失败");
    chatEl.insertAdjacentHTML("beforeend", messageHtml(
      { role: "assistant", content: data.answer, sources: data.sources, meta: data.meta }));
    chatEl.scrollTop = chatEl.scrollHeight;
  } catch (e) {
    chatEl.insertAdjacentHTML("beforeend",
      `<div class="msg bot msg-error">${SVG.alert}${escapeHtml(e.message)}</div>`);
  } finally {
    $("send").disabled = false;
    $("q").focus();
  }
}
$("send").onclick = send;
$("q").onkeydown = e => { if (e.key === "Enter") send(); };

// ---------- 启动 ----------
fetch("/docs").then(r => {
  const st = $("status");
  st.textContent = r.ok ? "服务正常" : "服务异常";
  st.classList.toggle("ok", r.ok);
  st.classList.toggle("err", !r.ok);
});
(async () => {
  await refreshSessions();
  // 无会话时自动建一个,保证打开即可提问;有会话则自动选最近活跃的并回显
  if (!currentSessionId) {
    const sessions = await SessionsAPI.list().catch(() => []);
    if (sessions.length) await switchSession(sessions[0].id);
    else await createSession();
  }
})();
</script>
</body>
</html>

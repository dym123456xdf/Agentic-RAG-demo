<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>知识库管理</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<aside id="sidebar">
  <div class="brand">
    <h1><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>知识库管理</h1>
    <div id="status">未连接</div>
  </div>
  <a class="btn ghost btn-block" href="/"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>返回聊天</a>
  <div class="side-note">文件入库 / 转换核对 / 历史回溯</div>
</aside>

<section id="main">
  <div id="content">
    <div class="tabs">
      <button class="tab active" data-tab="files"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>文件管理</button>
      <button class="tab" data-tab="history"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>问答历史</button>
    </div>

    <!-- ============ Tab 1: 文件管理 ============ -->
    <div class="panel active" id="panel-files">
      <div class="notice" id="mineruNotice" style="display:none">
        MinerU 未启用(MINERU_ENABLED=false):PDF/DOCX/PPTX 走 UnstructuredReader 兜底,
        无转换产物可核对。如需人工检查转换质量,请在 .env 开启后重新上传。
      </div>

      <h3>上传文件入库</h3>
      <div class="drop" id="drop">点击或拖拽文件到这里<br>支持 PDF / Word / PPT / MD / TXT</div>
      <input type="file" id="file" multiple hidden accept=".pdf,.docx,.pptx,.md,.markdown,.txt">

      <h3>索引服务器目录</h3>
      <div class="dir-row">
        <input type="text" id="dirpath" placeholder="例如 data/ 或 /abs/path" value="data/">
        <button class="btn ghost" id="btnDir">扫描并入库</button>
      </div>

      <h3>已入库文件 <span id="fileCount">(0)</span></h3>
      <ul class="file-list" id="fileList"><li class="empty">暂无</li></ul>
      <div class="stat" id="stats">尚未入库</div>
      <button class="btn ghost" id="btnRefresh" style="margin-top:10px">刷新列表</button>
    </div>

    <!-- ============ Tab 2: 问答历史 ============ -->
    <div class="panel" id="panel-history">
      <div class="history-wrap">
        <div class="history-sessions">
          <h3>会话</h3>
          <ul class="session-list" id="histSessions"></ul>
        </div>
        <div class="history-msgs">
          <h3 id="histTitle">对话记录</h3>
          <div id="histMsgs"><div class="empty-hint">选择左侧会话查看对话记录</div></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- 转换产物弹层 -->
<div class="md-overlay" id="mdOverlay">
  <div class="md-box">
    <header>
      <span id="mdTitle">转换产物</span>
      <button class="close" id="mdClose" title="关闭" aria-label="关闭"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg></button>
    </header>
    <pre id="mdContent" style="display:none"></pre>
      <div id="mdRender" class="md-render" style="display:none"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/app.js"></script>
<script>
const $ = id => document.getElementById(id);

// ---------- Tab 切换 ----------
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
  document.querySelectorAll(".panel").forEach(p =>
    p.classList.toggle("active", p.id === "panel-" + t.dataset.tab));
  if (t.dataset.tab === "history") refreshHistSessions();
});

// ---------- 上传入库(自首页搬移) ----------
const drop = $("drop"), fileInput = $("file");
drop.onclick = () => fileInput.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add("drag"); };
drop.ondragleave = () => drop.classList.remove("drag");
drop.ondrop = e => {
  e.preventDefault(); drop.classList.remove("drag");
  const files = e.dataTransfer ? e.dataTransfer.files : e.target.files;
  if (files && files.length) uploadFiles(files);
};
fileInput.onchange = e => { if (e.target.files.length) uploadFiles(e.target.files); };

async function uploadFiles(files) {
  const fd = new FormData();
  for (const f of files) fd.append("files", f);
  showToast("上传并入库中...");
  try {
    const r = await fetch("/upload/files", { method: "POST", body: fd });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "上传失败");
    const skip = (data.skipped_files || []).length;
    showToast(skip > 0
      ? `新入库 ${data.chunks_ingested} 个片段,跳过 ${skip} 个重复文件`
      : `入库 ${data.chunks_ingested} 个片段,共 ${data.total_entities} 条`);
    refreshFiles();
  } catch (e) { showToast(e.message, true); }
}

$("btnDir").onclick = async () => {
  const path = $("dirpath").value.trim();
  if (!path) return showToast("请填路径", true);
  showToast("扫描目录并入库...");
  try {
    const r = await fetch("/upload/dir", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "失败");
    const skip = (data.skipped_files || []).length;
    showToast(skip > 0
      ? `新入库 ${data.chunks_ingested} 个片段,跳过 ${skip} 个已存在文件`
      : `从 ${data.ingested_from} 入库 ${data.chunks_ingested} 个片段`);
    refreshFiles();
  } catch (e) { showToast(e.message, true); }
};

// ---------- 已入库文件列表(name/chunks/has_converted) ----------
async function refreshFiles() {
  try {
    const r = await fetch("/upload/files");
    const data = await r.json();
    $("mineruNotice").style.display = data.mineru_enabled ? "none" : "block";
    const ul = $("fileList");
    $("fileCount").textContent = `(${data.file_count})`;
    $("stats").textContent = `共 ${data.total_chunks} 条向量 / ${data.file_count} 文件`;
    if (!data.files.length) {
      ul.innerHTML = '<li class="empty">暂无</li>';
      return;
    }
    ul.innerHTML = "";
    for (const f of data.files) {
      const li = document.createElement("li");
      li.innerHTML =
        `<span class="name" title="${escapeHtml(f.name)}">${SVG.file}<span class="n-text">${escapeHtml(f.name)}</span></span>` +
        `<span class="chunks">${f.chunks}</span>` +
        (f.has_converted ? `<span class="view-md" data-name="${escapeHtml(f.name)}">查看转换MD</span>` : "");
      ul.appendChild(li);
    }
  } catch (e) { /* ignore */ }
}

// ---------- 转换产物弹层 ----------
// 把 md 文本里 `![alt](images/X)` 替换成 <img src="/converted/<name>/images/X">,
// 其余文本保留(不做完整 markdown 渲染,够看 + 看图就够)。
function renderMdWithImages(md, name) {
  // 先 escape(防止后端 md 里含 < > 破坏 HTML),再插入 img 标签
  let html = escapeHtml(md);
  html = html.replace(
    /!\[([^\]]*)\]\(images\/([^)]+)\)/g,
    (_, alt, file) => `<img class="md-img" src="/converted/${encodeURIComponent(name)}/images/${file}" alt="${alt}">`
  );
  return html;
}

$("fileList").onclick = async e => {
  const el = e.target.closest(".view-md");
  if (!el) return;
  try {
    const r = await fetch(`/upload/converted/${encodeURIComponent(el.dataset.name)}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "读取失败");
    // stem = 原文件名去后缀,即产物文件夹名 / 图片 URL 前缀
    const baseName = el.dataset.name.replace(/\.[^.]+$/, "");
    $("mdTitle").textContent = `转换产物:${d.name}`;
    $("mdRender").innerHTML = renderMdWithImages(d.content, baseName);
    $("mdRender").style.display = "block";
    $("mdContent").style.display = "none";
    $("mdOverlay").classList.add("show");
  } catch (err) { showToast(err.message, true); }
};
$("mdClose").onclick = () => $("mdOverlay").classList.remove("show");
$("mdOverlay").onclick = e => { if (e.target === e.currentTarget) $("mdOverlay").classList.remove("show"); };

// ---------- 问答历史 tab ----------
let histCurrentId = null;

async function refreshHistSessions(selectId = null) {
  try {
    const sessions = await SessionsAPI.list();
    const ul = $("histSessions");
    if (!sessions.length) {
      ul.innerHTML = '<li class="empty">暂无会话,去首页提问后这里会出现记录</li>';
      return;
    }
    ul.innerHTML = "";
    for (const s of sessions) {
      const li = document.createElement("li");
      if (s.id === (selectId || histCurrentId)) li.classList.add("active");
      li.innerHTML = `<span class="title" title="${escapeHtml(s.title)}">${escapeHtml(s.title)}</span>` +
                     `<span class="del">✕</span>`;
      li.onclick = async e => {
        if (e.target.classList.contains("del")) {
          if (!confirm("删除该会话及其全部对话记录?")) return;
          await SessionsAPI.remove(s.id).catch(err => showToast(err.message, true));
          if (s.id === histCurrentId) { histCurrentId = null; $("histMsgs").innerHTML = '<div class="empty-hint">选择左侧会话查看对话记录</div>'; }
          refreshHistSessions();
          return;
        }
        histCurrentId = s.id;
        await renderHistMessages(s.id);
        refreshHistSessions(s.id);
      };
      ul.appendChild(li);
    }
    if (!selectId && !histCurrentId && sessions.length) {
      histCurrentId = sessions[0].id;
      await renderHistMessages(sessions[0].id);
      refreshHistSessions(sessions[0].id);
    }
  } catch (e) { showToast(e.message, true); }
}

async function renderHistMessages(sessionId) {
  try {
    const msgs = await SessionsAPI.messages(sessionId);
    const box = $("histMsgs");
    $("histTitle").textContent = `对话记录(${msgs.length} 条)`;
    if (!msgs.length) {
      box.innerHTML = '<div class="empty-hint">该会话暂无对话记录</div>';
      return;
    }
    // 按问答对分组:user 提问 + 对应 assistant 回答合成一条,来源/meta 折叠可展开
    let html = "";
    for (let i = 0; i < msgs.length; i++) {
      const m = msgs[i];
      if (m.role === "user") {
        html += `<div class="hist-item"><div class="q">${SVG.help}<span>${escapeHtml(m.content)}</span></div>`;
        const a = msgs[i + 1] && msgs[i + 1].role === "assistant" ? msgs[i + 1] : null;
        if (a) {
          html += `<div class="a">${renderChatImages(escapeHtml(a.content))}</div>`;
          if (a.sources && a.sources.length) {
            let src = `<b class="src-title">${SVG.clip}参考来源</b>`;
            for (const s of a.sources) {
              src += `<div class="src">[#${s.index}] <b>${escapeHtml(s.source)}</b> ` +
                     `<span class="src-score">score=${s.score}</span><br>` +
                     `<span class="src-snippet">${escapeHtml(String(s.content).slice(0, 200))}…</span></div>`;
            }
            html += `<details><summary>展开来源与详情</summary><div class="sources">${src}</div>${metaHtml(a.meta)}</details>`;
          }
          i++;
        }
        html += `</div>`;
      }
    }
    box.innerHTML = html;
  } catch (e) { showToast(e.message, true); }
}

// ---------- 启动 ----------
fetch("/docs").then(r => {
  const st = $("status");
  st.textContent = r.ok ? "服务正常" : "服务异常";
  st.classList.toggle("ok", r.ok);
  st.classList.toggle("err", !r.ok);
});
refreshFiles();
</script>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install ruff
      - name: Ruff lint
        run: ruff check app/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ".[dev]" || pip install fastapi uvicorn python-dotenv pydantic httpx pytest pytest-asyncio
      - name: Run unit tests
        run: pytest tests/ -m "not integration" --tb=short
        env:
          MINIMAX_API_KEY: ci-dummy-key
          MINIMAX_GROUP_ID: ci-dummy-group
